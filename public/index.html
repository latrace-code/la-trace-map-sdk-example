<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Exemple d'integration - SDK carto La Trace</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
    #app { display: flex; flex-direction: column; height: 100%; }
    header { padding: 10px 16px; background: #101214; color: #fff; display: flex; align-items: center; gap: 16px; }
    header b { color: #c7fb0e; }
    .search { position: relative; }
    #search { padding: 8px 12px; border: none; border-radius: 6px; width: 280px; font-size: 14px; }
    #suggestions { position: absolute; top: 40px; left: 0; right: 0; margin: 0; padding: 0; list-style: none;
      background: #fff; color: #101214; border-radius: 6px; overflow: hidden; z-index: 10; box-shadow: 0 4px 12px #0004; }
    #suggestions li { padding: 8px 12px; cursor: pointer; font-size: 14px; }
    #suggestions li:hover { background: #f0f2f3; }
    #map { flex: 1; min-height: 0; }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <span><b>La Trace</b> - exemple d'integration SDK</span>
      <div class="search">
        <input id="search" type="text" placeholder="Rechercher un lieu..." autocomplete="off" />
        <ul id="suggestions"></ul>
      </div>
    </header>
    <div id="map"></div>
  </div>
  <script src="/config.js"></script>
  <script type="module" src="/dist/app.bundle.js"></script>
</body>
</html>
